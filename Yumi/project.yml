name: Yumi
options:
  bundleIdPrefix: app.yumi
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # French is the language the code is written in; English comes from the String Catalogs
    # (Sources/App/Localization)
    DEVELOPMENT_LANGUAGE: fr
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # DEVELOPMENT_TEAM is not set here: scripts/release.sh passes it from YUMI_TEAM_ID.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Yumi.entitlements

schemes:
  YumiPhone:
    build:
      targets:
        YumiPhone: all
    run:
      config: Debug
    archive:
      config: Release
  Yumi:
    build:
      targets:
        Yumi: all
        YumiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YumiTests
    archive:
      config: Release
  YumiAppStore:
    build:
      targets:
        YumiAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  # Yumi on iPhone: works alone, and with the Mac through iCloud when the person turns it on.
  # It shares the code that has no AppKit (Contracts, Character, Core, Memory...) and has its
  # own views in Sources/iOS. Nothing in it may need the Mac app to exist, and the reverse.
  YumiPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      # The same parts the tests compile without the app, minus what only a Mac can do
      - path: Sources/App/Contracts
      - path: Sources/App/Character
        excludes:
          - BotCanvasView.swift
          - YumiGallery.swift
      - path: Sources/App/Core
        excludes:
          - HookLauncher.swift
          - Chat/ClaudeCLI.swift
      - path: Sources/App/Memory
      - path: Sources/App/Initiative
        excludes:
          - InitiativeDriver.swift
      - path: Sources/App/Permissions
      - path: Sources/App/AgentRuntime
        excludes:
          - Providers/ClaudeCodeLLMProvider.swift
      # The modules' data and stores; their Mac side (NSWorkspace, AppleScript, IOKit) stays out
      - path: Sources/App/Modules
        excludes:
          - Mail/MailApp.swift
          - Mail/GmailModule.swift
          - ClaudeCode/ClaudeCodeModule.swift
          - ClaudeCode/TerminalTab.swift
          - ScreenTime/ScreenTimeModule.swift
          - Notion/NotionModule.swift
          - Notes/NotesModule.swift
          - Music/MusicModule.swift
          - GitHub/GitHubModule.swift
          - Agenda/AgendaModule.swift
          - Weather/WeatherModule.swift
          - Music/AudioActivity.swift
          - AgentBridges.swift
          - Notion/NotionAgentStore.swift
      - path: Sources/App/Context
        excludes:
          - Providers/WorkspaceContextProvider.swift
          - Providers/WindowContextProvider.swift
      - path: Sources/App/Island/IslandTypes.swift
      - path: Sources/App/App/AppIdentity.swift
      - path: Sources/App/App/SoundEngine.swift
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Sources/App/Link
      - path: Sources/iOSShared
      - path: Sources/App/Localization/Localizable.xcstrings
    dependencies:
      - target: YumiPhoneWidgets
    # Generated from here (XcodeGen rewrites the file): the link with the Mac goes through the
    # person's private CloudKit database, and CloudKit wakes the app with silent pushes.
    entitlements:
      path: Resources/YumiPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.yumi]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # Shared with the widgets: what Yumi says now, and his pictures
        com.apple.security.application-groups: [group.app.yumi]
    info:
      path: Resources/InfoPhone.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # The colour of the opening (PhoneSplash): the system shows it before the app draws
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The link with the Mac (Link/CloudKitLink.swift): the container of the entitlements
        YumiCloudKitContainer: iCloud.app.yumi
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: YES
        NSCalendarsFullAccessUsageDescription: "Je lis ton calendrier pour t'annoncer ton prochain rendez-vous. Rien ne quitte ton iPhone."
        NSFaceIDUsageDescription: "Face ID confirme que c'est bien toi qui autorises une demande de ton Mac."
        NSRemindersFullAccessUsageDescription: "Je te montre tes rappels du jour, je coche ceux que tu termines, et j'en ajoute quand tu me le demandes."
        NSLocationWhenInUseUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/InfoPhone.plist
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: J5U6R6ZV6K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_CODE_SIGN_FLAGS: ""
        CODE_SIGN_ENTITLEMENTS: Resources/YumiPhone.entitlements
      configs:
        # An iPhone only runs signed apps: unlike the Mac's Debug builds, these are signed
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES

  # The Live Activity of a Mac request (Lock Screen, Dynamic Island). Its buttons run
  # LinkAnswerIntent in the app's process.
  YumiPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/iOSWidgets
      - path: Sources/iOSShared
      - path: Sources/App/Contracts/YumiLink.swift
      - path: Sources/App/Link
      - path: Sources/App/Core/StudioMode.swift
      - path: Sources/App/Localization/Localizable.xcstrings
    entitlements:
      path: Resources/YumiPhoneWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.yumi]
    info:
      path: Resources/InfoPhoneWidgets.plist
      properties:
        CFBundleDisplayName: Yumi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        YumiCloudKitContainer: iCloud.app.yumi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.iphone.widgets
        PRODUCT_NAME: YumiPhoneWidgets
        INFOPLIST_FILE: Resources/InfoPhoneWidgets.plist
        CODE_SIGN_ENTITLEMENTS: Resources/YumiPhoneWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: J5U6R6ZV6K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
      configs:
        # An iPhone only runs signed apps: unlike the Mac's Debug builds, these are signed
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES

  Yumi:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - iOS/**
          - iOSShared/**
          - iOSWidgets/**
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi
        CFBundleVersion: "12"
        CFBundleShortVersionString: "0.1.0"
        YumiDisplayVersion: "0.1.0-beta.2"
        # The Yumi GitHub App (Modules/GitHub/GitHubApp.swift): its public Client ID and its slug,
        # filled in once the maintainer registered it. Empty: only the personal token is offered.
        YumiGitHubAppClientID: ""
        YumiGitHubAppSlug: ""
        # The iCloud container of the link with the iPhone (App/MacLink.swift). Empty: no link.
        # Set it only in a build signed with the iCloud entitlement for that container.
        YumiCloudKitContainer: ""
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Je lis l'adresse de la page ouverte dans ton navigateur quand tu me la montres, je lis ta boîte de réception dans Mail (sans rien y changer) et j'y ouvre en brouillon les réponses que tu enverras toi-même, j'envoie par Mail ce que tu confirmes, et je mets ta musique en pause ou au morceau suivant, ou j'ouvre l'onglet du terminal où travaille Claude Code, quand tu me le demandes."
        # Not a key macOS reads: Accessibility consent is given in System Settings, with no custom text.
        # Kept as a record of why the app asks for it.
        NSAccessibilityUsageDescription: "Je lis le titre de la fenêtre que tu me montres, et j'écoute la touche Échap et ton raccourci."
        # Asked the first time the user presses the matching button of a module, never at launch.
        NSCalendarsFullAccessUsageDescription: "Je lis ton calendrier pour t'annoncer ton prochain rendez-vous. Rien ne quitte ton Mac."
        NSRemindersFullAccessUsageDescription: "Je te montre tes rappels du jour, je coche ceux que tu termines, et j'en ajoute quand tu me le demandes."
        NSDownloadsFolderUsageDescription: "Je dépose dans Téléchargements les fichiers que tu me demandes de créer."
        NSDocumentsFolderUsageDescription: "Je crée dans Documents les fichiers que tu me demandes d'y mettre, et j'y travaille si tu y as placé mon dossier."
        NSDesktopFolderUsageDescription: "Je crée sur ton Bureau les fichiers que tu me demandes d'y mettre."
        NSLocationWhenInUseUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
        NSLocationUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  YumiAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - iOS/**
          - iOSShared/**
          - iOSWidgets/**
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi.appstore
        CFBundleVersion: "12"
        CFBundleShortVersionString: "0.1.0"
        YumiDisplayVersion: "0.1.0-beta.2"
        # The Yumi GitHub App (Modules/GitHub/GitHubApp.swift): its public Client ID and its slug,
        # filled in once the maintainer registered it. Empty: only the personal token is offered.
        YumiGitHubAppClientID: ""
        YumiGitHubAppSlug: ""
        # The iCloud container of the link with the iPhone (App/MacLink.swift). Empty: no link.
        # Set it only in a build signed with the iCloud entitlement for that container.
        YumiCloudKitContainer: ""
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        # Asked the first time the user presses the matching button of a module, never at launch.
        NSCalendarsFullAccessUsageDescription: "Je lis ton calendrier pour t'annoncer ton prochain rendez-vous. Rien ne quitte ton Mac."
        NSRemindersFullAccessUsageDescription: "Je te montre tes rappels du jour, je coche ceux que tu termines, et j'en ajoute quand tu me le demandes."
        NSDownloadsFolderUsageDescription: "Je dépose dans Téléchargements les fichiers que tu me demandes de créer."
        NSDocumentsFolderUsageDescription: "Je crée dans Documents les fichiers que tu me demandes d'y mettre, et j'y travaille si tu y as placé mon dossier."
        NSDesktopFolderUsageDescription: "Je crée sur ton Bureau les fichiers que tu me demandes d'y mettre."
        NSLocationWhenInUseUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
        NSLocationUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.appstore
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/YumiAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE

  # Unit tests. Not hosted by the app: the files under test are compiled into the
  # bundle, so running the tests never launches Yumi (no socket, no Keychain, no window).
  # Only add files here that have no dependency on the rest of the app.
  # Core/, Modules/, Memory/, Initiative/, Context/, AgentRuntime/ and Permissions/ as a whole follow that rule: nothing in them may use a view, AppState,
  # the hook server or a sound. Core/ knows nothing about Modules/ either.
  YumiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/App/Island/IslandStateMachine.swift
      - path: Sources/App/Island/IslandLayout.swift
      - path: Sources/App/Core
      - path: Sources/App/Modules
      - path: Sources/App/Contracts/ModuleTypes.swift
      - path: Sources/App/Contracts/ChatLive.swift
      - path: Sources/App/Contracts/MemoryTypes.swift
      - path: Sources/App/Memory
      - path: Sources/App/Initiative
      - path: Sources/App/Context
      - path: Sources/App/AgentRuntime
      - path: Sources/App/Permissions
      - path: Sources/App/Contracts/RemarkTypes.swift
      - path: Sources/App/Contracts/IslandLookTypes.swift
      - path: Sources/App/Contracts/CharacterCommands.swift
      - path: Sources/App/Character/YumiWorkHabit.swift
      - path: Sources/App/Character/YumiFaceTurn.swift
      - path: Sources/App/Contracts/AgentLook.swift
      - path: Sources/App/Contracts/YumiLink.swift
      - path: Sources/App/Contracts/EventAnimations.swift
      - path: Sources/App/App/AppIdentity.swift
      # The tests read the translations too, in French and in English
      - path: Sources/App/Localization/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: ""
