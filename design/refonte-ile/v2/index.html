<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumi · Île et Workspace</title>
<link rel="stylesheet" href="../yumi.css">
<style>
:root {
  --desk: #0E1018;          /* fond du bureau simulé */
  --bg: #151823;            /* fond principal : noir légèrement bleuté */
  --side: #1B1E2A;          /* sidebar : gris très foncé */
  --card: #242838;          /* cartes : anthracite */
  --raise: #2F3447;         /* surfaces secondaires */
  --hover: #383E54;
  --line: rgba(255,255,255,.08);
  --fg: #F4F5F8;            /* texte principal */
  --fg2: #BCC1D3;           /* gris secondaire 1 */
  --fg3: #A2A8BD;           /* gris secondaire 2 */
  --blue: #5B8CFF; --violet: #8B6CFF; --pink: #F58AD9; --amber: #FFB547; --red: #FF5D6C; --green: #3DDC97;
  --grad: linear-gradient(120deg, #5B8CFF, #8B6CFF 55%, #F58AD9);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --r: 14px;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--desk); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 }
input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }

/* ---------- Bureau simulé ---------- */
.desk { position: fixed; inset: 0; background:
  radial-gradient(900px 500px at 15% 110%, rgba(139,108,255,.18), transparent 60%),
  radial-gradient(800px 500px at 95% 0%, rgba(91,140,255,.14), transparent 60%), var(--desk) }
.menubar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 13px; color: var(--fg2); z-index: 5 }
.menubar b { color: var(--fg) }
.menubar .r { margin-left: auto; display: flex; gap: 14px; align-items: center }
.demo { position: fixed; left: 16px; bottom: 16px; z-index: 30; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 32px);
  background: rgba(36,40,56,.92); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; backdrop-filter: blur(12px); font-size: 13px }
.demo .tag { color: var(--amber); padding: 0 6px; font-weight: 600 }
.demo button { padding: 5px 10px; border-radius: 8px; color: var(--fg2) }
.demo button:hover { background: var(--raise); color: var(--fg) }
.demo button[aria-pressed="true"] { background: var(--fg); color: #0B0C12 }
.demo .sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px }

/* ---------- L'île ---------- */
.island { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 40; width: 560px; max-width: calc(100% - 24px);
  background: #000; border-radius: 0 0 28px 28px; box-shadow: 0 18px 50px rgba(0,0,0,.55);
  transition: width .45s cubic-bezier(.3,1.3,.5,1), height .45s cubic-bezier(.3,1.3,.5,1), border-radius .3s; overflow: hidden; height: var(--ih, 190px) }
.island.folded { width: 300px; height: 34px; border-radius: 0 0 16px 16px; cursor: pointer }
.island .notch { height: 32px }
.island .wing { position: absolute; top: 4px; height: 26px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg2); opacity: 0; transition: opacity .2s }
.island.folded .wing { opacity: 1 }
.island .wing.l { left: 14px } .island .wing.r { right: 14px }
.island .wing .yumi { width: 30px; height: 25px }
.ibody { display: flex; gap: 14px; padding: 0 20px 16px 18px; transition: opacity .2s }
.island.folded .ibody { opacity: 0; pointer-events: none }
.seat { flex: 0 0 76px; height: 64px; margin-top: 4px }
.seat .yumi { width: 76px; height: 64px }
.icontent { flex: 1; min-width: 0 }
.lead { font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; margin: 4px 0 2px }
.sub { color: var(--fg2); font-size: 14px; margin: 0 }
.irow { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 10px; border-radius: 12px; background: #15171F; width: 100%; text-align: left }
.irow:hover { background: #1F2231 }
.irow .t { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.irow .t small { color: var(--fg3); font-size: 13px; margin-left: 6px }
.irow .go { color: var(--fg3); font-size: 13px }
.iacts { display: flex; gap: 8px; margin-top: 12px }
.ibtn { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 11px; background: #1F2231; color: var(--fg); font-size: 14px; font-weight: 500 }
.ibtn:hover { background: #2A2E42 }
.ibtn.primary { background: var(--fg); color: #0B0C12 }
.ibtn.primary:hover { background: #fff }
.ibtn.apps { margin-left: auto; background: linear-gradient(#1F2231,#1F2231) padding-box, var(--grad) border-box; border: 1.5px solid transparent }
.ibtn svg { width: 16px; height: 16px; flex: 0 0 auto } .ibtn span { max-width: 120px; overflow: hidden; text-overflow: ellipsis } .iacts { flex-wrap: nowrap; min-width: 0 }
.mini { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto }
.ichat { max-height: 150px; overflow-y: auto; margin-top: 4px; display: flex; flex-direction: column; gap: 8px }
.me { align-self: flex-end; background: #23263A; padding: 7px 12px; border-radius: 14px 14px 4px 14px; font-size: 14px; max-width: 85% }
.yu { font-size: 15px; color: var(--fg); max-width: 92% }
.ifield { display: flex; gap: 8px; margin-top: 10px }
.ifield input { flex: 1; min-width: 0; height: 36px; border-radius: 11px; border: 1px solid #2A2E42; background: #15171F; padding: 0 12px; font-size: 14px; outline: none }
.ifield input:focus { border-color: var(--blue) }
.dots { display: inline-flex; gap: 4px } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg3); animation: dot 1s infinite } .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
@keyframes dot { 50% { opacity: .3; transform: translateY(-2px) } }
.ikind { font-size: 13px; color: var(--fg2); display: flex; align-items: center; gap: 6px; margin-top: 4px }
.risk { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: rgba(255,181,71,.15); color: var(--amber) }

/* ---------- Fenêtre Workspace ---------- */
.win { position: fixed; top: 210px; left: 50%; transform: translateX(-50%); width: min(1180px, calc(100% - 32px)); height: calc(100% - 280px); min-height: 460px;
  display: grid; grid-template-columns: 236px 1fr; background: var(--bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0,0,0,.5); z-index: 20; transition: opacity .25s, transform .25s }
.win.closed { opacity: 0; transform: translateX(-50%) translateY(20px) scale(.98); pointer-events: none }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; min-height: 0 }
.lights { display: flex; gap: 8px; padding: 2px 6px 14px } .lights button { width: 12px; height: 12px; border-radius: 50% }
.lights .c { background: #FF5F57 } .lights .m { background: #FEBC2E } .lights .z { background: #28C840 }
.who { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px }
.who .yumi { width: 44px; height: 37px }
.who b { display: block; font-size: 16px } .who span { font-size: 13px; color: var(--fg3) }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button, .pins button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--fg2); font-size: 14px; text-align: left; width: 100% }
.nav button:hover, .pins button:hover { background: var(--card); color: var(--fg) }
.nav button[aria-current="page"] { background: var(--raise); color: var(--fg); font-weight: 600 }
.nav svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9 }
.nav .badge { margin-left: auto; font-size: 12px; font-weight: 600; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; background: var(--blue); color: #fff; padding: 0 6px }
.side h4 { font-size: 13px; color: var(--fg3); font-weight: 500; margin: 18px 10px 6px }
.pins { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0 }
.pins .mini { width: 22px; height: 22px; border-radius: 6px }
.side .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--fg3); border-top: 1px solid var(--line) }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.bar { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px; border-bottom: 1px solid var(--line); flex: 0 0 auto }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--fg3); min-width: 0 }
.crumb button { color: var(--fg3); padding: 6px 10px; border-radius: 7px } .crumb button:hover { background: var(--card); color: var(--fg) }
.crumb b { color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar .grow { flex: 1 }
.qsearch { display: flex; align-items: center; gap: 8px; height: 34px; width: 260px; border-radius: 10px; background: var(--card); padding: 0 12px; color: var(--fg3); font-size: 14px }
.qsearch:hover { background: var(--raise) }
.close { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--fg2); font-size: 18px } .close:hover { background: var(--card); color: var(--fg) }
.content { flex: 1; overflow-y: auto; padding: 26px 28px 40px; min-height: 0 }
.content > * { animation: in .22s ease-out }
@keyframes in { from { opacity: 0; transform: translateY(6px) } }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; line-height: 1.25 }
h2 { font-size: 18px; letter-spacing: -.01em; margin: 0 0 12px }
h3 { font-size: 16px; margin: 0 0 4px }
.lede { color: var(--fg2); font-size: 16px; margin: 0 0 24px }
.muted { color: var(--fg3) } .soft { color: var(--fg2) }
.grid2 { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 18px; align-items: start }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px }
.card { background: var(--card); border-radius: var(--r); padding: 18px; border: 1px solid var(--line) }
.card + .card { margin-top: 18px }
.list { display: flex; flex-direction: column }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 10px; text-align: left; width: 100%; min-width: 0 }
button.li:hover, .li.link:hover { background: var(--raise) }
.li .t { flex: 1; min-width: 0 }
.li .t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .t span { display: block; font-size: 13px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .r { font-size: 13px; color: var(--fg3); white-space: nowrap }
.li.sel { background: var(--raise) }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 8px; background: var(--raise); color: var(--fg2); white-space: nowrap }
.pill.blue { background: rgba(91,140,255,.16); color: #9DB8FF } .pill.green { background: rgba(61,220,151,.14); color: #7FE8B8 } .pill.amber { background: rgba(255,181,71,.15); color: #FFCB7D } .pill.red { background: rgba(255,93,108,.15); color: #FF9AA4 } .pill.violet { background: rgba(139,108,255,.18); color: #BBA8FF }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--raise); font-size: 14px; font-weight: 500 }
.btn:hover { background: var(--hover) }
.btn.primary { background: var(--fg); color: #0B0C12 } .btn.primary:hover { background: #fff }
.btn.danger { color: #FF9AA4 }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.tabs { display: flex; gap: 4px; margin: 0 0 18px; flex-wrap: wrap }
.tabs button { height: 34px; padding: 0 14px; border-radius: 9px; color: var(--fg2); font-size: 14px }
.tabs button:hover { background: var(--card); color: var(--fg) }
.tabs button[aria-pressed="true"] { background: var(--raise); color: var(--fg); font-weight: 600 }
.split { display: grid; grid-template-columns: 330px minmax(0,1fr); gap: 18px; align-items: start }
.field { display: flex; align-items: center; gap: 10px; height: 42px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); padding: 0 14px; margin-bottom: 18px }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px }
.field:focus-within { border-color: var(--blue) }
.empty { padding: 30px; text-align: center; color: var(--fg3) }

/* Accueil du Workspace */
.hello { display: flex; gap: 18px; align-items: center; margin-bottom: 24px }
.hello .yumi { width: 70px; height: 59px }
.hello h1 { margin: 0 }
.now { background: linear-gradient(135deg, rgba(91,140,255,.16), rgba(139,108,255,.12) 50%, rgba(245,138,217,.1)); border: 1px solid rgba(139,108,255,.25) }
.now h2 { font-size: 20px; margin-bottom: 6px }

/* Applications */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 14px }
.app { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; transition: transform .15s, background .15s, border-color .15s; min-width: 0 }
.app:hover { background: var(--raise); transform: translateY(-2px); border-color: rgba(255,255,255,.14) }
.app .ico { width: 52px; height: 52px; border-radius: 13px }
.app b { font-size: 16px }
.app p { margin: 0; font-size: 14px; color: var(--fg3); line-height: 1.4 }
.app .state { font-size: 13px; color: var(--fg2); display: flex; align-items: center; gap: 6px; margin-top: auto }
.app .fav { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--fg3); font-size: 16px }
.app .fav:hover { background: var(--hover); color: var(--fg) }
.app .fav[aria-pressed="true"] { color: var(--amber) }
.recent { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px }
.recent button { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px }
.recent button:hover { background: var(--raise) }
.recent .mini { width: 30px; height: 30px; border-radius: 8px }
.cat { margin: 0 0 12px; font-size: 16px; color: var(--fg2); font-weight: 600 }
.catblock + .catblock { margin-top: 26px }

/* Icônes d'application : dessinées ici, pas copiées */
.ico, .mini { display: grid; place-items: center; color: #fff }
.ico svg { width: 28px; height: 28px } .mini svg { width: 60%; height: 60% }
.i-claude { background: linear-gradient(140deg, #3F7BFF, #7FD0FF) }
.i-github { background: linear-gradient(140deg, #2B3045, #4A5170) }
.i-devact { background: linear-gradient(140deg, #22C98A, #4FA0FF) }
.i-mail { background: linear-gradient(140deg, #5B8CFF, #8B6CFF) }
.i-chat { background: linear-gradient(140deg, #8B6CFF, #F58AD9) }
.i-agenda { background: linear-gradient(140deg, #FF5D6C, #FF9A3D) }
.i-tasks { background: linear-gradient(140deg, #FFB547, #FFD37A); color: #3A2A00 }
.i-files { background: linear-gradient(140deg, #4FA0FF, #7FD0FF) }
.i-music { background: linear-gradient(140deg, #F58AD9, #B07BFF) }
.i-day { background: linear-gradient(140deg, #FFB3E6, #FFB547); color: #3A1F00 }
.i-memory { background: linear-gradient(140deg, #7B5CFF, #C9A8FF) }
.i-assistant { background: radial-gradient(circle at 30% 30%, #8B6CFF, #3F2A8F) }

/* GitHub */
.heat { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; overflow: hidden }
.heat i { border-radius: 3px; background: var(--raise) }
.heat i.l1 { background: #23476E } .heat i.l2 { background: #2F6FC0 } .heat i.l3 { background: #5B8CFF } .heat i.l4 { background: #A9C2FF }
.ev { display: flex; gap: 12px; padding: 12px 10px; border-radius: 10px; width: 100%; text-align: left }
.ev:hover { background: var(--raise) }
.ev .evi { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto; background: var(--raise); font-size: 15px }
.ev .t { flex: 1; min-width: 0 } .ev .t b { font-weight: 500 } .ev .t span { display: block; font-size: 13px; color: var(--fg3) }
.ev .r { font-size: 13px; color: var(--fg3); white-space: nowrap }
.daylabel { font-size: 13px; color: var(--fg3); margin: 16px 10px 4px; font-weight: 600 }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line) }
.check:last-child { border: 0 }
.file { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px }
.add { color: var(--green) } .del { color: var(--red) }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: #11131B; border-radius: 10px; padding: 12px 14px; color: #D6DAEA; white-space: pre-wrap; margin: 10px 0 0; overflow-x: auto }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.stat b { display: block; font-size: 24px; letter-spacing: -.02em } .stat span { font-size: 13px; color: var(--fg3) }

/* Claude Code */
.tl { position: relative; padding-left: 22px } .tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--raise) }
.tl .step { position: relative; padding: 6px 0 10px; font-size: 14px } .tl .step::before { content: ''; position: absolute; left: -20px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--raise); border: 2px solid var(--bg) }
.tl .step.ok::before { background: var(--green) } .tl .step.wait::before { background: var(--amber) } .tl .step.run::before { background: var(--blue) }
.tl .step span { color: var(--fg3); font-size: 13px; display: block }
.ask { border: 1px solid rgba(255,181,71,.35); background: linear-gradient(rgba(255,181,71,.07), rgba(255,181,71,.03)) }
.progress { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden } .progress i { display: block; height: 100%; background: var(--grad); border-radius: 3px }

/* Mail */
.mailbox { display: grid; grid-template-columns: 170px 320px 1fr; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-height: 460px }
.mailbox > div { min-width: 0 }
.folders { padding: 10px; border-right: 1px solid var(--line); background: #1F2231 }
.folders button { display: flex; width: 100%; justify-content: space-between; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--fg2) }
.folders button:hover { background: var(--raise) } .folders button[aria-pressed="true"] { background: var(--raise); color: var(--fg); font-weight: 600 }
.mlist { border-right: 1px solid var(--line); overflow-y: auto; max-height: 560px }
.mi { display: block; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line) }
.mi:hover { background: var(--raise) } .mi.sel { background: var(--raise) }
.mi .h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px } .mi .h b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mi .h span { color: var(--fg3); font-size: 13px; white-space: nowrap }
.mi .s { font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mi .p { font-size: 13px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mi.unread .h b::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 7px; vertical-align: 1px }
.reader { padding: 22px 26px }
.reader h2 { font-size: 20px; margin-bottom: 6px } .reader .from { font-size: 14px; color: var(--fg2); margin-bottom: 18px }
.reader p { font-size: 15px; color: var(--fg); line-height: 1.6; margin: 0 0 12px }

/* Musique */
.player { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: center }
.cover { width: 260px; height: 260px; border-radius: 18px; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.4) }
.cover::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, rgba(255,255,255,.35), transparent 40%) }
.mcover { width: 40px; height: 40px; border-radius: 8px; flex: 0 0 auto }
.ctl { display: flex; gap: 14px; align-items: center; margin-top: 18px }
.ctl button { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--raise) } .ctl button:hover { background: var(--hover) }
.ctl button.play { width: 60px; height: 60px; background: var(--fg); color: #0B0C12 }
.ctl svg { width: 20px; height: 20px }
.scrub { height: 6px; background: var(--raise); border-radius: 3px; margin-top: 22px; position: relative; overflow: hidden } .scrub i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); border-radius: 3px }
.times { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg3); margin-top: 6px }

/* Agenda */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px }
.cal .h { font-size: 13px; color: var(--fg3); text-align: center; padding-bottom: 4px }

.cal button:hover { background: var(--raise) } .cal button.today { background: var(--blue); color: #fff; font-weight: 600 } .cal button.sel { outline: 2px solid var(--fg) }
.cal button.out { opacity: .35 }
.cal button i { width: 5px; height: 5px; border-radius: 50%; background: var(--pink) }
.evt { display: flex; gap: 14px; padding: 12px; border-radius: 12px; width: 100%; text-align: left } .evt:hover, .evt.sel { background: var(--raise) }
.evt .time { width: 58px; font-weight: 600; font-size: 15px } .evt .bar2 { width: 4px; border-radius: 2px; align-self: stretch }

/* Tâches */
.task { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 10px }
.task:hover { background: var(--raise) }
.task .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--fg3); display: grid; place-items: center; flex: 0 0 auto; color: #0B0C12; font-size: 13px; font-weight: 700 }
.task.done .box { background: var(--green); border-color: var(--green) } .task.done .t b { text-decoration: line-through; color: var(--fg3) }
.task .t { flex: 1; min-width: 0 } .task .t b { font-weight: 500 } .task .t span { display: block; font-size: 13px; color: var(--fg3) }

/* Conversations */
.thread { display: flex; flex-direction: column; gap: 14px; padding: 6px 0 }
.thread .me { font-size: 15px }
.thread .yu { display: flex; gap: 10px; align-items: flex-start }
.thread .yu .av { width: 28px; height: 28px; border-radius: 50%; background: var(--grad); flex: 0 0 auto }
.compose { display: flex; gap: 10px; margin-top: 18px }
.compose input { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); padding: 0 14px; outline: none; font-size: 15px }
.compose input:focus { border-color: var(--blue) }
.from-island { font-size: 12px; font-weight: 600; color: #BBA8FF }

/* Mémoire */
.mem { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 10px }
.mem:hover { background: var(--raise) }
.mem .t { flex: 1; min-width: 0 } .mem .t span { display: block; font-size: 13px; color: var(--fg3) }
.mem .acts { display: flex; gap: 4px; opacity: 0; transition: opacity .15s } .mem:hover .acts, .mem:focus-within .acts { opacity: 1 }
.mem .acts button { padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--fg2) } .mem .acts button:hover { background: var(--hover); color: var(--fg) }
.mem input { width: 100%; background: var(--bg); border: 1px solid var(--blue); border-radius: 8px; padding: 6px 10px; outline: none; font-size: 15px }

/* Paramètres */
.set { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.set:last-child { border: 0 } .set .t { flex: 1 } .set .t span { display: block; font-size: 13px; color: var(--fg3) }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--hover); position: relative; flex: 0 0 auto; transition: background .2s }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s }
.sw[aria-checked="true"] { background: var(--green) } .sw[aria-checked="true"]::after { transform: translateX(18px) }

.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--fg); color: #0B0C12; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; transition: .25s; z-index: 60; pointer-events: none }
.toast.on { opacity: 1; transform: translateX(-50%) }

      body = `<div class="card">${rowsHTML(PRS.map(p => li({ go: 'github/pr/' + p.n, lead: dot(p.state === 'merged' ? 'var(--violet)' : p.checks.some(c => c[0] === 'fail') ? 'var(--red)' : 'var(--green)'), t: `PR ${p.n} · ${esc(p.title)}`, s: `${p.repo} · ${p.branch} · par ${p.by} · ${p.when}`, r: p.state === 'merged' ? '<span class="pill violet">Fusionnée</span>' : p.review ? '<span class="pill amber">Relecture demandée</span>' : '<span class="pill green">Ouverte</span>' })))}</div>`;
    } else if (tab === 'issues') {
      body = `<div class="card">${rowsHTML(ISSUES.map(i => li({ lead: dot('var(--green)'), t: `Issue ${i.n} · ${esc(i.title)}`, s: `ouverte par ${i.by} · ${i.when} · ${i.comments} commentaires`, r: `<span class="pill ${i.label[1]}">${i.label[0]}</span>`, attrs: 'data-act="toastIssue"' })))}</div>`;
    } else if (tab === 'commits') {
      body = `<div class="card">${rowsHTML(COMMITS.map(c => li({ lead: `<span class="pill file">${c[4]}</span>`, t: esc(c[0]), s: `${c[1]} · ${c[2]}`, r: c[3], attrs: 'data-act="toastCommit"' })))}</div>`;
    } else {
      body = `<div class="card">${rowsHTML(REPOS.map(r => li({ lead: ico('github', 'mini'), t: r[0], s: `${r[1]} · ${r[2]}`, r: `<span class="pill">${r[3]}</span>` })))}<p class="muted" style="margin:12px 10px 0;font-size:13px">Les dépôts suivis se choisissent dans Paramètres › GitHub.</p></div>`;
    }
    return head + tabs + body;
  },
  claude(id) {
    if (id) return sessView(SESS.find(s => s.id === id) || SESS[0]);
    const act = SESS.filter(s => s.status !== 'done'), done = SESS.filter(s => s.status === 'done');
    const card = (s) => li({ go: 'claude/' + s.id, lead: dot(s.status === 'ask' ? 'var(--amber)' : s.status === 'run' ? 'var(--blue)' : 'var(--green)'), t: esc(s.task), s: `${s.agent} · ${s.repo} · ${s.when}`, r: s.status === 'ask' ? '<span class="pill amber">Attend ton accord</span>' : s.status === 'run' ? `<span class="pill blue">${s.progress} %</span>` : '<span class="pill green">Terminée</span>' });
    return `<div class="row" style="margin-bottom:18px">${ico('claude')}<div><h1 style="margin:0">Claude Code</h1><p class="soft" style="margin:0">Et les autres agents : Codex, Gemini CLI. Chaque demande passe par toi.</p></div></div>
      <div class="stats"><div class="stat"><b>${act.length}</b><span>Sessions actives</span></div><div class="stat"><b>${SESS.filter(s => s.status === 'ask').length}</b><span>Demandes d’accord</span></div><div class="stat"><b>${done.length}</b><span>Terminées aujourd’hui</span></div><div class="stat"><b>12</b><span>Tests ajoutés</span></div></div>
      <div class="grid2"><div><div class="card"><h2>Sessions actives</h2>${rowsHTML(act.map(card))}</div><div class="card"><h2>Sessions terminées</h2>${rowsHTML(done.map(card))}</div></div>
      <div class="card"><h2>Activité récente</h2><div class="tl">${SESS.flatMap(s => s.steps.slice(-1).map(st => `<div class="step ${st[0]}">${esc(st[1])}<span>${s.repo} · ${st[2]}</span></div>`)).join('')}</div></div></div>`;
  },
  mail(id) {
    const boxes = [['inbox', 'Réception'], ['sent', 'Envoyés']], cats = ['Tout', 'Important', 'Personnel', 'Suivis', 'Promotions'];
    const list = MAILS.filter(m => m.box === S.mailBox && (S.mailCat === 'Tout' || m.cat === S.mailCat));
    const cur = MAILS.find(m => m.id === id);
    if (cur && cur.unread) cur.unread = false;
    const idx = list.indexOf(cur);
    return `<div class="row" style="margin-bottom:18px">${ico('mail')}<div><h1 style="margin:0">Mail</h1><p class="soft" style="margin:0">${MAILS.filter(m => m.unread).length} non lus · Gmail</p></div></div>
      <div class="tabs">${cats.map(c => `<button data-mailcat="${c}" aria-pressed="${S.mailCat === c}">${c}</button>`).join('')}</div>
      <div class="mailbox"><div class="folders">${boxes.map(([k, l]) => `<button data-mailbox="${k}" aria-pressed="${S.mailBox === k}">${l}<span class="muted">${MAILS.filter(m => m.box === k && m.unread).length || ''}</span></button>`).join('')}</div>
      <div class="mlist">${list.map(m => `<button class="mi ${m.unread ? 'unread' : ''} ${cur === m ? 'sel' : ''}" data-go="mail/${m.id}"><div class="h"><b>${esc(m.from)}</b><span>${m.when}</span></div><div class="s">${esc(m.subject)}</div><div class="p">${esc(m.prev)}</div></button>`).join('') || '<p class="empty">Rien ici.</p>'}</div>
      <div class="reader">${cur ? `<div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="pill">${cur.cat}</span><span class="row"><button class="btn" ${idx > 0 ? `data-go="mail/${list[idx - 1].id}"` : 'disabled style="opacity:.4"'}>‹ Précédent</button><button class="btn" ${idx >= 0 && idx < list.length - 1 ? `data-go="mail/${list[idx + 1].id}"` : 'disabled style="opacity:.4"'}>Suivant ›</button></span></div>
        <h2>${esc(cur.subject)}</h2><p class="from">${esc(cur.from)} · ${cur.when}</p>${cur.body.map(b => `<p>${esc(b)}</p>`).join('')}
        <div class="row" style="margin-top:22px"><button class="btn primary" data-act="draftReply">Préparer une réponse avec Yumi</button><button class="btn" data-act="toastArchive">Archiver</button></div>
        <p class="muted" style="font-size:13px;margin-top:10px">Yumi prépare un brouillon. Rien ne part sans ton clic.</p>` : `<div class="empty" style="padding-top:120px">Choisis un message à gauche pour le lire.</div>`}</div></div>`;
  },
  music() {
    const [t, a, al, cov, len] = MUSIC.tracks[MUSIC.i];
    return `<div class="row" style="margin-bottom:22px">${ico('music')}<div><h1 style="margin:0">Musique</h1><p class="soft" style="margin:0">Musique · ce qui joue sur ton Mac</p></div></div>
      <div class="card"><div class="player"><div class="cover" style="background:${cov}"></div><div>
        <p class="muted" style="margin:0 0 6px">${MUSIC.playing ? 'Lecture en cours' : 'En pause'}</p><h1 style="font-size:32px">${esc(t)}</h1><p class="soft" style="font-size:17px;margin:0">${esc(a)} · ${esc(al)}</p>
        <div class="scrub"><i style="width:${(MUSIC.pos / len * 100).toFixed(1)}%"></i></div><div class="times"><span>${fmt(MUSIC.pos)}</span><span>${fmt(len)}</span></div>
        <div class="ctl"><button data-act="prev" aria-label="Titre précédent">${GLYPH.prev}</button><button class="play" data-act="musicToggle" aria-label="${MUSIC.playing ? 'Pause' : 'Lecture'}">${MUSIC.playing ? GLYPH.pause : GLYPH.play}</button><button data-act="next" aria-label="Titre suivant">${GLYPH.next}</button></div>
      </div></div></div>
      <div class="card"><h2>À suivre et déjà écoutés</h2>${rowsHTML(MUSIC.tracks.map((x, i) => li({ lead: `<span class="mcover" style="background:${x[3]}"></span>`, t: esc(x[0]), s: `${esc(x[1])} · ${esc(x[2])}`, r: i === MUSIC.i ? '<span class="pill blue">En cours</span>' : fmt(x[4]), sel: i === MUSIC.i, attrs: `data-track="${i}"` })))}</div>`;
  },
  agenda(id) {
    const sel = EVENTS.find(e => e.id === id) || null; if (sel) S.calDay = sel.day;
    const days = [];
    for (let i = 0; i < 35; i++) { const d = i - 5; days.push(d < 1 || d > 30 ? `<button class="out" tabindex="-1">${d < 1 ? 26 + d + 5 : d - 30}</button>` : `<button data-day="${d}" class="${d === 18 ? 'today' : ''} ${d === S.calDay && d !== 18 ? 'sel' : ''}">${d}${EVENTS.some(e => e.day === d) ? '<i></i>' : ''}</button>`) }
    const dayEvts = EVENTS.filter(e => e.day === S.calDay);
    return `<div class="row" style="margin-bottom:18px">${ico('agenda')}<div><h1 style="margin:0">Agenda</h1><p class="soft" style="margin:0">Novembre 2026 · Calendrier du Mac</p></div></div>
      <div class="grid2"><div class="card"><h2>Novembre</h2><div class="cal">${['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(d => `<span class="h">${d}</span>`).join('')}${days.join('')}</div></div>
      <div><div class="card"><h2>${S.calDay === 18 ? 'Aujourd’hui' : S.calDay + ' novembre'}</h2>${dayEvts.length ? dayEvts.map(e => `<button class="evt ${sel === e ? 'sel' : ''}" data-go="agenda/${e.id}"><span class="time">${e.time}</span><span class="bar2" style="background:${e.color}"></span><span><b>${esc(e.title)}</b><span class="muted" style="display:block;font-size:13px">${e.time} – ${e.end} · ${esc(e.where)}</span></span></button>`).join('') : '<p class="empty">Rien ce jour-là.</p>'}</div>
      ${sel ? `<div class="card"><p class="pill" style="margin:0 0 10px">Détails</p><h2>${esc(sel.title)}</h2><p class="soft" style="margin:0">${sel.day} novembre · ${sel.time} – ${sel.end}<br>${esc(sel.where)}</p>${sel.note ? `<p style="margin:12px 0 0">${esc(sel.note)}</p>` : ''}<div class="row" style="margin-top:14px"><button class="btn" data-act="toastRemind">Me le rappeler 30 min avant</button></div></div>` : ''}
      <div class="card"><h2>Prochains rendez-vous</h2>${EVENTS.filter(e => e.day >= 18).map(e => `<button class="evt" data-go="agenda/${e.id}"><span class="time">${e.day === 18 ? e.time : e.day + '/11'}</span><span class="bar2" style="background:${e.color}"></span><span><b>${esc(e.title)}</b><span class="muted" style="display:block;font-size:13px">${esc(e.where)}</span></span></button>`).join('')}</div></div></div>`;
  },
  tasks() {
    const pri = { haute: 'red', moyenne: 'amber', basse: '' };
    const list = TASKS.map((t, i) => [t, i]).filter(([t]) => S.taskTab === 'todo' ? !t.done : S.taskTab === 'done' ? t.done : !!t.reminder);
    return `<div class="row" style="margin-bottom:18px">${ico('tasks')}<div><h1 style="margin:0">Tâches et rappels</h1><p class="soft" style="margin:0">Rappels du Mac · ${TASKS.filter(t => !t.done).length} à faire</p></div></div>
      <div class="tabs">${[['todo', 'À faire'], ['reminders', 'Rappels'], ['done', 'Terminées']].map(([k, l]) => `<button data-tasktab="${k}" aria-pressed="${S.taskTab === k}">${l}</button>`).join('')}</div>
      <div class="card">${list.length ? list.map(([t, i]) => `<div class="task ${t.done ? 'done' : ''}"><button class="box" data-task="${i}" role="checkbox" aria-checked="${t.done}" aria-label="${t.done ? 'Remettre à faire' : 'Marquer comme faite'} : ${esc(t.t)}">${t.done ? '✓' : ''}</button><span class="t"><b>${esc(t.t)}</b><span>${esc(t.list)}${t.reminder ? ' · ' + esc(t.reminder) : ''}</span></span><span class="pill ${pri[t.pri]}">${t.pri}</span><span class="pill">${esc(t.due)}</span></div>`).join('') : '<p class="empty">Rien ici.</p>'}
      <form class="compose" data-form="task"><input id="newtask" placeholder="Ajouter une tâche… (« appeler maman demain »)" aria-label="Nouvelle tâche"><button class="btn primary" type="submit">Ajouter</button></form></div>`;
  },
  files() {
    return `<div class="row" style="margin-bottom:18px">${ico('files')}<div><h1 style="margin:0">Fichiers</h1><p class="soft" style="margin:0">Ce que tu as déposé dans l’île. Yumi ne lit que ce que tu lui donnes.</p></div></div>
      <div class="card">${rowsHTML(FILES.map(f => li({ lead: ico('files', 'mini'), t: esc(f[0]), s: f[1], r: f[2], attrs: 'data-act="toastFile"' })))}</div>`;
  },
  day() {
    return `<div class="row" style="margin-bottom:18px">${ico('day')}<div><h1 style="margin:0">Résumé de journée</h1><p class="soft" style="margin:0">Mercredi 18 novembre</p></div></div>
      <div class="card now"><h2>Ce matin</h2><p style="margin:0;font-size:16px;line-height:1.6">Trois nouveaux mails, dont la confirmation du dentiste jeudi. Point d’équipe à 10 h 30, cours à 14 h. Deux PR attendent ta relecture. Il fera 11 °C, prends une veste.</p></div>
      <div class="card"><h2>Hier soir</h2><p class="soft" style="margin:0;line-height:1.6">Tu as terminé deux tâches, fusionné une PR, et écouté 1 h 40 de musique.</p></div>`;
  },
  conversations(id) {
    const q = S.convQuery.trim().toLowerCase();
    const list = CONVS.filter(c => !q || (c.title + c.msgs.map(m => m[1]).join(' ')).toLowerCase().includes(q));
    const cur = id === 'new' ? { id: 'new', title: 'Nouvelle conversation', msgs: [] } : CONVS.find(c => c.id === id) || null;
    return `<h1>Conversations</h1><p class="lede">Tout ce que tu as dit à Yumi, dans l’île ou ici. Rien ne disparaît.</p>
      <div class="split"><div><div class="row" style="margin-bottom:12px"><button class="btn primary" data-go="conversations/new">＋ Nouvelle conversation</button></div>
        <label class="field">${GLYPH.search.replace('<svg', '<svg width="18" height="18"')}<input id="convq" placeholder="Chercher dans les discussions" value="${esc(S.convQuery)}" aria-label="Chercher dans les discussions"></label>
        <div class="card" style="padding:8px">${list.length ? list.map(c => li({ go: 'conversations/' + c.id, lead: ico('chat', 'mini'), t: esc(c.title), s: `${c.island ? '<span class="from-island">Depuis l’île</span> · ' : ''}${esc(c.msgs[c.msgs.length - 1]?.[1] || '')}`, r: c.when, sel: cur && cur.id === c.id })).join('') : '<p class="empty">Aucune discussion ne contient « ' + esc(S.convQuery) + ' ».</p>'}</div></div>
      <div class="card" style="min-height:420px">${cur ? `<h2>${esc(cur.title)}</h2><div class="thread" id="thread">${cur.msgs.map(([w, t]) => w === 'me' ? `<div class="me">${esc(t)}</div>` : `<div class="yu"><span class="av"></span><span>${esc(t)}</span></div>`).join('') || '<p class="muted">Pose ta question, Yumi répond ici.</p>'}</div>
        <form class="compose" data-form="conv" data-id="${cur.id}"><input id="convin" placeholder="Écris à Yumi…" aria-label="Message à Yumi"><button class="btn primary" type="submit">Envoyer</button></form>` : `<div class="empty" style="padding-top:140px">Choisis une conversation pour la reprendre, ou commence-en une nouvelle.</div>`}</div></div>`;
  },
  memoire() {
    const groups = [...new Set(MEMORY.map(m => m.g))];
    return `<h1>Mémoire</h1><p class="lede">Ce que Yumi sait de toi, et d’où il le tient. Tu peux corriger ou faire oublier chaque ligne.</p>
      <div class="grid2"><div>${groups.map(g => `<div class="card"><h2>${g}</h2>${MEMORY.map((m, i) => [m, i]).filter(([m]) => m.g === g).map(([m, i]) => S.memEdit === i ? `<form class="mem" data-form="mem" data-i="${i}"><input id="memin" value="${esc(m.t)}" aria-label="Corriger"><button class="btn primary" type="submit">Garder</button></form>` : `<div class="mem"><span class="t">${esc(m.t)}<span>Appris : ${esc(m.src)}</span></span><span class="acts"><button data-memedit="${i}">Corriger</button><button data-memdel="${i}">Oublier</button></span></div>`).join('')}</div>`).join('') || '<div class="card"><p class="empty">Yumi ne sait plus rien de toi. Il réapprendra en t’écoutant.</p></div>'}</div>
      <div><div class="card"><h2>Ce que Yumi utilise maintenant</h2><p class="soft" style="margin:0 0 10px">Le contexte de ta prochaine question.</p>${rowsHTML([li({ lead: ico('agenda', 'mini'), t: 'Ton agenda du jour', s: '3 événements' }), li({ lead: ico('claude', 'mini'), t: 'La session yumi', s: 'Brancher la grille des applications' }), li({ lead: ico('memory', 'mini'), t: `${MEMORY.length} souvenirs`, s: 'Ceux de gauche' })])}</div>
      <div class="card"><h2>Tes préférences</h2><div class="set"><span class="t">Réponses courtes<span>Yumi va à l’essentiel.</span></span><button class="sw" role="switch" aria-checked="true" data-sw="short" aria-label="Réponses courtes"></button></div><div class="set"><span class="t">Apprendre de mes conversations<span>Sinon, rien n’est retenu.</span></span><button class="sw" role="switch" aria-checked="true" data-sw="learn" aria-label="Apprendre de mes conversations"></button></div></div>
      <div class="card"><p class="soft" style="margin:0 0 12px">Tout reste sur ce Mac.</p><button class="btn danger" data-act="forgetAll">Tout oublier…</button></div></div></div>`;
  },
  recherche() {
    const q = S.search.trim().toLowerCase(), hits = [];
    if (q) {
      Object.keys(APPS).forEach(k => { if ((APPS[k].name + APPS[k].desc).toLowerCase().includes(q)) hits.push(['Applications', li({ attrs: `data-app="${k}"`, lead: ico(k, 'mini'), t: esc(APPS[k].name), s: esc(APPS[k].desc) })]) });
      CONVS.forEach(c => { if ((c.title + c.msgs.map(m => m[1]).join(' ')).toLowerCase().includes(q)) hits.push(['Conversations', li({ go: 'conversations/' + c.id, lead: ico('chat', 'mini'), t: esc(c.title), s: c.when })]) });
      MAILS.forEach(m => { if ((m.from + m.subject + m.prev).toLowerCase().includes(q)) hits.push(['Mails', li({ go: 'mail/' + m.id, lead: ico('mail', 'mini'), t: esc(m.subject), s: esc(m.from) })]) });
      TASKS.forEach(t => { if (t.t.toLowerCase().includes(q)) hits.push(['Tâches', li({ go: 'tasks', lead: ico('tasks', 'mini'), t: esc(t.t), s: esc(t.due) })]) });
      FILES.forEach(f => { if (f[0].toLowerCase().includes(q)) hits.push(['Fichiers', li({ go: 'files', lead: ico('files', 'mini'), t: esc(f[0]), s: f[1] })]) });
      PRS.forEach(p => { if ((p.title + ' pr ' + p.n).toLowerCase().includes(q)) hits.push(['GitHub', li({ go: 'github/pr/' + p.n, lead: ico('github', 'mini'), t: `PR ${p.n} · ${esc(p.title)}`, s: p.repo })]) });
      EVENTS.forEach(e => { if (e.title.toLowerCase().includes(q)) hits.push(['Agenda', li({ go: 'agenda/' + e.id, lead: ico('agenda', 'mini'), t: esc(e.title), s: `${e.day} novembre · ${e.time}` })]) });
      MEMORY.forEach(m => { if (m.t.toLowerCase().includes(q)) hits.push(['Mémoire', li({ go: 'memoire', lead: ico('memory', 'mini'), t: esc(m.t), s: m.g })]) });
    }
    const groups = [...new Set(hits.map(h => h[0]))];
    return `<h1>Recherche</h1><p class="lede">Une conversation, un mail, une tâche, un fichier, une application : tout se cherche ici.</p>
      <label class="field">${GLYPH.search.replace('<svg', '<svg width="18" height="18"')}<input id="gsearch" placeholder="Chercher partout dans Yumi" value="${esc(S.search)}" aria-label="Chercher partout dans Yumi"></label>
      <div id="results">${!q ? `<p class="cat">Essaie</p><div class="recent">${['dentiste', 'PR', 'dîner', 'TD', 'musique'].map(w => `<button data-q="${w}">${w}</button>`).join('')}</div>` : groups.length ? groups.map(g => `<div class="card"><h2>${g}</h2>${rowsHTML(hits.filter(h => h[0] === g).map(h => h[1]))}</div>`).join('') : `<p class="empty">Rien ne correspond à « ${esc(S.search)} ».</p>`}</div>`;
  },
  reglages() {
    const sw = (k, t, s) => `<div class="set"><span class="t">${t}<span>${s}</span></span><button class="sw" role="switch" aria-checked="${S.settings[k]}" data-set="${k}" aria-label="${t}"></button></div>`;
    return `<h1>Paramètres</h1><p class="lede">Les réglages de Yumi, et ceux de chaque application.</p>
      <div class="grid2"><div><div class="card"><h2>Général</h2>${sw('sounds', 'Sons de Yumi', 'Un petit son quand quelque chose t’attend.')}${sw('fold', 'Replier l’île toute seule', 'Après quelques secondes sans rien à dire.')}${sw('summary', 'Résumé à la fin d’une session', 'Ce que l’agent a fait, en une ligne.')}</div>
      <div class="card"><h2>Claude Code et agents</h2>${sw('harmless', 'Laisser passer les demandes sans risque', 'Lire des fichiers, regarder git, lancer les tests. Supprimer, pousser, installer ou aller sur internet attendent toujours ton clic.')}<div class="set"><span class="t">Hooks installés<span>Claude Code · Codex · Gemini CLI</span></span><button class="btn">Vérifier</button></div></div></div>
      <div class="card"><h2>Applications</h2>${rowsHTML(Object.keys(APPS).map(k => li({ lead: ico(k, 'mini'), t: esc(APPS[k].name), s: esc(APPS[k].cat), r: k === 'mail' || k === 'github' ? '<span class="pill green">Connecté</span>' : '<span class="pill">Réglages ›</span>', attrs: 'data-act="toastSettings"' })))}</div></div>`;
  },
};
function musicCard() {
  const [t, a, , cov] = MUSIC.tracks[MUSIC.i];
  return `<div class="card"><h2>En ce moment</h2><div class="li" style="padding:0"><span class="mcover" style="background:${cov};width:52px;height:52px;border-radius:10px"></span><span class="t"><b>${esc(t)}</b><span>${esc(a)} · ${MUSIC.playing ? 'lecture en cours' : 'en pause'}</span></span>
    <button class="close" data-act="musicToggle" aria-label="${MUSIC.playing ? 'Pause' : 'Lecture'}" style="width:40px;height:40px">${MUSIC.playing ? GLYPH.pause.replace('<svg', '<svg width="18" height="18"') : GLYPH.play.replace('<svg', '<svg width="18" height="18"')}</button><button class="close" data-go="music" aria-label="Ouvrir Musique">›</button></div></div>`;
}
function heat() { let h = '', seed = 7; for (let i = 0; i < 182; i++) { seed = (seed * 9301 + 49297) % 233280; const r = seed / 233280, l = i > 175 ? 4 : r < .35 ? 0 : r < .6 ? 1 : r < .8 ? 2 : r < .93 ? 3 : 4; h += `<i class="${l ? 'l' + l : ''}"></i>` } return `<div class="heat" aria-label="Graphique des contributions">${h}</div>` }
function prView(p) {
  const ci = { ok: ['✓', 'var(--green)', 'réussi'], fail: ['✕', 'var(--red)', 'en échec'], run: ['●', 'var(--blue)', 'en cours'] };
  return `<div class="row" style="margin-bottom:6px"><span class="pill ${p.state === 'merged' ? 'violet' : 'green'}">${p.state === 'merged' ? 'Fusionnée' : 'Ouverte'}</span><span class="muted">${p.repo} · ${p.branch} → main</span></div>
    <h1>PR ${p.n} · ${esc(p.title)}</h1><p class="lede">Par ${p.by} · ${p.when} · <span class="add">+${p.add}</span> <span class="del">−${p.del}</span></p>
    <div class="grid2"><div><div class="card"><h2>Ce que Yumi en dit</h2><p style="margin:0;line-height:1.6">${p.n === 30 ? 'Une petite correction sur la fenêtre de l’île. Deux tests échouent : ils attendent l’ancien comportement du plein écran.' : `${p.files.length} fichiers, surtout du nouveau code. ${p.checks.every(c => c[0] === 'ok') ? 'Toutes les vérifications passent.' : 'Une vérification n’est pas encore finie.'}`}</p></div>
      <div class="card"><h2>Fichiers modifiés</h2>${p.files.map(f => `<div class="check"><span class="file" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f[0])}</span><span class="add file">+${f[1]}</span><span class="del file">−${f[2]}</span></div>`).join('')}</div>
      <div class="card"><h2>Commits</h2>${p.commits.map(c => `<div class="check">${dot('var(--blue)')}<span>${esc(c)}</span></div>`).join('')}</div></div>
    <div><div class="card"><h2>Vérifications</h2>${p.checks.map(c => `<div class="check"><span style="color:${ci[c[0]][1]};font-weight:700;width:16px">${ci[c[0]][0]}</span><span style="flex:1">${esc(c[1])}</span><span class="muted">${ci[c[0]][2]}</span></div>`).join('')}</div>
      ${p.state === 'open' ? `<div class="card"><h2>Ta relecture</h2><div class="row"><button class="btn primary" data-act="approvePR">Approuver</button><button class="btn" data-act="commentPR">Commenter</button></div><p class="muted" style="font-size:13px;margin:10px 0 0">S’ouvre sur GitHub pour que tu confirmes.</p></div>` : ''}
      <div class="card"><button class="btn" data-go="github/prs">‹ Toutes les PR</button></div></div></div>`;
}
function sessView(s) {
  const pill = s.status === 'ask' ? '<span class="pill amber">Attend ton accord</span>' : s.status === 'run' ? '<span class="pill blue">En cours</span>' : '<span class="pill green">Terminée</span>';
  return `<div class="row" style="margin-bottom:6px">${pill}<span class="muted">${s.agent} · ${s.repo} · ${s.when}</span></div><h1>${esc(s.task)}</h1>
    <div class="progress" style="margin:12px 0 22px;max-width:420px"><i style="width:${s.progress}%"></i></div>
    <div class="grid2"><div>${s.status === 'ask' ? `<div class="card ask"><p class="pill amber" style="margin:0 0 10px">Demande d’autorisation</p><h2>${esc(s.ask.what)} ?</h2><p style="margin:0">${esc(s.ask.change)}</p><p class="soft" style="margin:6px 0 0">${esc(s.ask.undo)}.</p>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Voir la commande</summary><div class="code">${esc(s.ask.cmd)}</div></details>
      <div class="row" style="margin-top:16px"><button class="btn primary" data-act="allow">Autoriser</button><button class="btn" data-act="deny">Refuser</button></div></div>` : ''}
      ${s.result ? `<div class="card"><h2>Résultat</h2><p style="margin:0">${esc(s.result)}</p></div>` : ''}
      <div class="card"><h2>Ce que l’agent a fait</h2><div class="tl">${s.steps.map(st => `<div class="step ${st[0]}">${esc(st[1])}<span>${st[2]}</span></div>`).join('')}</div></div></div>
    <div><div class="card"><h2>État des tâches</h2>${[['Lire le plan', true], ['Créer les fichiers', s.progress > 30], ['Lancer les tests', s.progress === 100], ['Résumer', s.progress === 100]].map(([t, d]) => `<div class="check"><span style="color:${d ? 'var(--green)' : 'var(--fg3)'};width:16px">${d ? '✓' : '○'}</span>${t}</div>`).join('')}</div>
    <div class="card"><button class="btn" data-go="claude">‹ Toutes les sessions</button></div></div></div>`;
}

/* ---------- Panneau de démonstration ---------- */
function renderDemo() {
  $('demo').innerHTML = `<span class="tag">Démo</span>${Object.entries(PROFILES).map(([k, p]) => `<button data-profile="${k}" aria-pressed="${S.profile === k}">${p.label}</button>`).join('')}<span class="sep"></span>
    <button data-act="notifGithub">Notification GitHub</button><button data-act="notifMail">Nouveau mail</button><button data-act="notifAsk">Demande de Claude Code</button><button data-act="fold">${S.folded ? 'Déplier l’île' : 'Replier l’île'}</button>${S.win ? '' : '<button data-act="openWin">Rouvrir le Workspace</button>'}`;
}

/* ---------- Interactions ---------- */
const REPLIES = [[/mail/i, 'Tu as trois nouveaux mails. Je t’ouvre Mail.', 'mail'], [/pr|github/i, 'Deux PR attendent ta relecture, la 31 et la 30. Je t’ouvre GitHub.', 'github'], [/musique|pause/i, 'C’est fait.', null], [/agenda|cours|rendez/i, 'Tu as cours à 14 h, amphi B.', 'agenda'], [/./, 'D’accord. Je garde ça dans Conversations, tu pourras le reprendre.', null]];
function islandSend(text) {
  S.chat.push(['me', text]); S.thinking = true; mood('reflechi', 'think', 'reflechir'); renderIsland();
  setTimeout(() => {
    const [, ans, app] = REPLIES.find(([re]) => re.test(text)); S.thinking = false; S.chat.push(['yu', ans]); mood('heureux', 'calm');
    if (/musique|pause/i.test(text)) MUSIC.playing = !MUSIC.playing;
    const conv = CONVS.find(c => c.id === 'live') || (CONVS.unshift({ id: 'live', title: text.slice(0, 40), when: 'À l’instant', island: true, msgs: [] }), CONVS[0]);
    conv.msgs = S.chat.slice(); renderIsland(); if (app) setTimeout(() => go(app, false), 700); else render();
  }, 900);
}
let foldTimer;
function armFold() { clearTimeout(foldTimer); if (S.settings.fold && S.island === 'home' && !S.notif) foldTimer = setTimeout(() => { S.folded = true; renderIsland(); renderDemo() }, 12000) }
function notify(n) { S.notif = n; S.island = 'notif'; S.folded = false; mood(n.kind === 'ask' ? 'curieux' : 'surpris', n.kind === 'ask' ? 'warn' : 'joy', null); renderIsland(); renderDemo(); setTimeout(() => mood('neutre', n.kind === 'ask' ? 'warn' : 'calm'), 1200) }
const ACTS = {
  talk() { S.island = 'talk'; S.folded = false; mood('curieux', 'calm', 'ecouter'); renderIsland(); setTimeout(() => $('iinput')?.focus(), 60) },
  islandHome() { S.island = 'home'; S.notif = null; mood('neutre', 'calm'); renderIsland(); armFold() },
  openApps() { S.win = true; go('apps') },
  openWin() { S.win = true; render() },
  closeWin() { S.win = false; render(); toast('Le Workspace est fermé. L’île reste là, « Applications » le rouvre.') },
  chatToWs() { go('conversations/live') },
  musicToggle() { MUSIC.playing = !MUSIC.playing; render() },
  prev() { MUSIC.i = (MUSIC.i + MUSIC.tracks.length - 1) % MUSIC.tracks.length; MUSIC.pos = 0; MUSIC.playing = true; render() },
  next() { MUSIC.i = (MUSIC.i + 1) % MUSIC.tracks.length; MUSIC.pos = 0; MUSIC.playing = true; render() },
  fold() { S.folded = !S.folded; renderIsland(); renderDemo() },
  notifGithub() { notify({ kind: 'info', app: 'github', lead: 'Léa te demande une relecture.', sub: 'PR 31 · Le Workspace de Yumi', go: 'github/pr/31' }) },
  notifMail() { notify({ kind: 'info', app: 'mail', lead: 'Nouveau mail de Léa Moreau.', sub: 'Photos du week-end', go: 'mail/m3' }) },
  notifAsk() { const s = SESS.find(x => x.id === 's1'); s.status = 'ask'; s.progress = 62; notify({ kind: 'ask', s }) },
  allow() { const s = SESS.find(x => x.id === 's1'); if (s.status !== 'ask') return; s.status = 'run'; s.progress = 80; s.steps = s.steps.filter(x => x[0] !== 'wait').concat([['run', 'Lance les tests', '10:23']]); mood('concentre', 'work', 'travailler');
    S.notif = { kind: 'done', app: 'claude', title: 'Claude Code · yumi', lead: 'Je m’en occupe.', sub: 'Les tests tournent. Je te dis quand c’est fini.', go: 'claude/s1' }; S.island = 'notif'; render();
    setTimeout(() => { s.status = 'done'; s.progress = 100; s.result = 'Tests réussis : 48 sur 48.'; s.steps = s.steps.filter(x => x[0] !== 'run').concat([['ok', 'Tests réussis : 48 sur 48', '10:24']]); mood('heureux', 'done', 'celebrer');
      S.notif = { kind: 'done', app: 'claude', title: 'Claude Code · yumi', lead: 'Les tests passent.', sub: '48 sur 48. La session est terminée.', go: 'claude/s1' }; render(); setTimeout(() => { mood('neutre', 'calm'); ACTS.islandHome() }, 5000) }, 2200) },
  deny() { const s = SESS.find(x => x.id === 's1'); if (s.status !== 'ask') return; s.status = 'run'; s.steps = s.steps.filter(x => x[0] !== 'wait').concat([['ok', 'Tu as refusé : l’agent continue sans lancer les tests', '10:23']]); mood('neutre', 'calm');
    S.notif = { kind: 'done', app: 'claude', title: 'Claude Code · yumi', lead: 'Refusé.', sub: 'L’agent le sait, il continue sans lancer les tests.', go: 'claude/s1' }; S.island = 'notif'; render(); setTimeout(() => ACTS.islandHome(), 4000) },
  forgetAll() { if (confirm('Tout oublier ? Yumi ne saura plus rien de toi. Ça ne se défait pas.')) { MEMORY = []; render(); toast('Yumi a tout oublié.') } },
  draftReply() { toast('Brouillon prêt dans Mail. Rien n’est envoyé.') }, toastArchive() { toast('Message archivé (démo).') }, toastIssue() { toast('S’ouvrirait sur GitHub.') }, toastCommit() { toast('Les fichiers du commit s’ouvriraient ici.') },
  toastRemind() { toast('Rappel ajouté 30 min avant.') }, toastFile() { toast('Aperçu du fichier (démo).') }, toastSettings() { toast('Les réglages de l’application s’ouvriraient ici.') },
  approvePR() { toast('GitHub s’ouvre pour confirmer ton approbation.') }, commentPR() { toast('GitHub s’ouvre sur la PR.') },
};
document.addEventListener('click', (e) => {
  const isl = e.target.closest('.island');
  if (isl && S.folded) { S.folded = false; renderIsland(); renderDemo(); armFold(); return }
  if (isl) armFold();
  const t = e.target.closest('[data-act],[data-go],[data-app],[data-fav],[data-cat],[data-profile],[data-mailbox],[data-mailcat],[data-track],[data-day],[data-task],[data-tasktab],[data-memedit],[data-memdel],[data-set],[data-sw],[data-q]');
  if (!t) return;
  const d = t.dataset;
  if (d.fav) { e.stopPropagation(); S.favs = S.favs.includes(d.fav) ? S.favs.filter(x => x !== d.fav) : [...S.favs, d.fav]; render(); toast(S.favs.includes(d.fav) ? 'Ajoutée aux raccourcis.' : 'Retirée des raccourcis.'); return }
  if (d.act) return ACTS[d.act]?.();
  if (d.go) return go(d.go, !!d.open || !!isl);
  if (d.app) return go(APP_ROUTE[d.app], !!isl);
  if (d.cat) { S.catFilter = d.cat; return render() }
  if (d.profile) { S.profile = d.profile; S.island = 'home'; S.notif = null; S.folded = false; mood('heureux', 'calm', null); setTimeout(() => mood('neutre', 'calm'), 900); return render() }
  if (d.mailbox) { S.mailBox = d.mailbox; return go('mail') }
  if (d.mailcat) { S.mailCat = d.mailcat; return go('mail') }
  if (d.track) { MUSIC.i = +d.track; MUSIC.pos = 0; MUSIC.playing = true; return render() }
  if (d.day) { S.calDay = +d.day; return go('agenda') }
  if (d.task) { TASKS[+d.task].done = !TASKS[+d.task].done; return render() }
  if (d.tasktab) { S.taskTab = d.tasktab; return render() }
  if (d.memedit) { S.memEdit = +d.memedit; render(); return $('memin')?.focus() }
  if (d.memdel) { const m = MEMORY.splice(+d.memdel, 1)[0]; render(); return toast('Oublié : « ' + m.t + ' »') }
  if (d.set) { S.settings[d.set] = !S.settings[d.set]; if (d.set === 'harmless' && S.settings.harmless) toast('Seules les demandes sans risque passeront seules.'); return render() }
  if (d.sw) { t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); return }
  if (d.q) { S.search = d.q; render(); return $('gsearch')?.focus() }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('.app[data-app]')) go(APP_ROUTE[e.target.dataset.app]);
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); go('recherche'); setTimeout(() => $('gsearch')?.focus(), 30) }
  if (e.key === 'Escape' && S.route !== 'accueil') { const top = S.route.split('/')[0]; go(S.route.includes('/') ? top : ROUTE_APP[top] ? 'apps' : 'accueil') }
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'ichat') { const v = $('iinput').value.trim(); if (v) islandSend(v) }
  if (f === 'task') { const v = $('newtask').value.trim(); if (v) { TASKS.unshift({ t: v, due: 'Aujourd’hui', pri: 'moyenne', list: 'Perso', done: false }); S.taskTab = 'todo'; render() } }
  if (f === 'mem') { MEMORY[+e.target.dataset.i].t = $('memin').value.trim() || MEMORY[+e.target.dataset.i].t; S.memEdit = null; render(); toast('Corrigé.') }
  if (f === 'conv') { const v = $('convin').value.trim(); if (!v) return; let c = CONVS.find(x => x.id === e.target.dataset.id); if (!c) { c = { id: 'c' + Date.now(), title: v.slice(0, 40), when: 'À l’instant', island: false, msgs: [] }; CONVS.unshift(c) }
    c.msgs.push(['me', v]); go('conversations/' + c.id); setTimeout(() => { c.msgs.push(['yu', 'Bien noté. Je te réponds ici, et tu retrouveras cette discussion depuis l’île.']); if (S.route === 'conversations/' + c.id) { render(); const th = $('thread'); if (th) th.lastElementChild.scrollIntoView({ block: 'nearest' }) } }, 800) }
});
const live = (id, key, cb) => document.addEventListener('input', (e) => { if (e.target.id !== id) return; S[key] = e.target.value; const pos = e.target.selectionStart; render(); const el = $(id); el.focus(); el.setSelectionRange(pos, pos); cb && cb() });
live('appq', 'appQuery'); live('convq', 'convQuery'); live('gsearch', 'search');
setInterval(() => { if (MUSIC.playing) { MUSIC.pos++; if (MUSIC.pos >= MUSIC.tracks[MUSIC.i][4]) { MUSIC.i = (MUSIC.i + 1) % MUSIC.tracks.length; MUSIC.pos = 0 } const s = document.querySelector('.scrub i'); if (s) { s.style.width = (MUSIC.pos / MUSIC.tracks[MUSIC.i][4] * 100) + '%'; document.querySelector('.times span').textContent = fmt(MUSIC.pos) } } }, 1000);

/* URL : ?profil=dev|etudiant|classique&vue=github/pr/31&ile=talk|notif|repliee */
const qs = new URLSearchParams(location.search);
if (PROFILES[qs.get('profil')]) S.profile = qs.get('profil');
if (qs.get('vue')) S.route = qs.get('vue');
render();
if (qs.get('ile') === 'talk') ACTS.talk(); else if (qs.get('ile') === 'notif') ACTS.notifAsk(); else if (qs.get('ile') === 'repliee') { S.folded = true; renderIsland() } else armFold();
</script>
